services:
  telegram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-telegram
    # Секреты (API ID, hash, строка сессии, сервисный токен) остаются в .env:
    # в compose они не переписываются, чтобы не расползались по двум местам.
    env_file:
      - .env
    environment:
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
      # Издатель токенов — кондуктор стенда. Адрес — имя его контейнера в
      # общей сети: по нему же сервис забирает ключи подписи и отзывы.
      CONDUCTOR_ISSUER: http://mcp-conductor:8000
      PUBLIC_URL: http://mcp-telegram:8000
    ports:
      # Только для проверки руками с хоста: кондуктор ходит по имени.
      - "${TELEGRAM_PORT:-8098}:8000"
    networks:
      - mcp-conductor
    # Keep stdin open and allocate a pseudo-TTY for interactive local runs.
    stdin_open: true
    tty: true
    # Optional: Uncomment the following lines to mount a local directory
    # for persisting the Telegram session file if NOT using TELEGRAM_SESSION_STRING.
    # Replace './telegram_sessions' with your desired host path.
    # volumes:
    #   - ./telegram_sessions:/app
    restart: unless-stopped

networks:
  # Сеть стенда кондуктора: он её создаёт, сервис к ней только подключается.
  mcp-conductor:
    external: true
